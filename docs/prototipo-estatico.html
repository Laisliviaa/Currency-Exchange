<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange & Analytics</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(51, 65, 85, 0.5);
            --primary-color: #10b981;
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: rgba(16, 185, 129, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 750;
            color: var(--text-main);
        }

        .logo i {
            color: var(--primary-color);
            background: var(--accent-glow);
            padding: 0.5rem;
            border-radius: 12px;
        }

        .badge {
            background: var(--accent-glow);
            color: var(--primary-color);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(16, 185, 129, 0.4);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h2 i {
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            color: #ffffff;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .chart-placeholder {
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            gap: 0.75rem;
            background: rgba(15, 23, 42, 0.3);
        }

        .chart-placeholder i {
            font-size: 2.5rem;
            color: var(--primary-color);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>Currency Exchange</span>
            </div>
            <div class="badge">
                <i class="fa-solid fa-circle" style="font-size: 8px; margin-right: 5px; color: #10b981;"></i> API Frankfurter Ativa
            </div>
        </header>

        <!-- Grade Principal -->
        <div class="dashboard-grid">
            <!-- Painel de Conversão -->
            <div class="card">
                <h2><i class="fa-solid fa-repeat"></i> Conversor de Moedas</h2>
                
                <div class="form-group">
                    <label for="amount">Valor</label>
                    <input type="number" id="amount" value="100" min="0" step="any">
                </div>

                <div class="form-group">
                    <label for="fromCurrency">Moeda de Origem</label>
                    <select id="fromCurrency">
                        <option value="EUR">EUR - Euro</option>
                        <option value="USD" selected>USD - Dólar Americano</option>
                        <option value="BRL">BRL - Real Brasileiro</option>
                        <option value="GBP">GBP - Libra Esterlina</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="toCurrency">Moeda de Destino</label>
                    <select id="toCurrency">
                        <option value="BRL" selected>BRL - Real Brasileiro</option>
                        <option value="USD">USD - Dólar Americano</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - Libra Esterlina</option>
                    </select>
                </div>

                <button class="btn-primary">Converter Agora</button>

                <div class="result-box">
                    <span class="result-label">Resultado Estimado:</span>
                    <span class="result-value">R$ 518,40</span>
                </div>
            </div>

            <!-- Painel de Gráfico / Análise -->
            <div class="card">
                <h2><i class="fa-solid fa-chart-area"></i> Histórico de Taxas (USD / BRL)</h2>
                
                <div class="chart-placeholder">
                    <i class="fa-solid fa-chart-simple"></i>
                    <p>O gráfico com o Recharts será renderizado aqui</p>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Últimos 30 dias de cotação</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
